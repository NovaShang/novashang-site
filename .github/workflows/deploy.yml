# One push to master publishes both sites from the same commit:
#   global  novashang.com  ->  Cloudflare Pages (project novashang-site)
#   cn      gaoshang.me    ->  Aliyun ESA Pages (no sign-in, ICP in the footer)
# Post media: global reads it from R2, cn from OSS. Uploading is local
# (npm run media:push, to both); each job only checks its store has every file.
#
# Repository secrets:
#   CLOUDFLARE_API_TOKEN    token with "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID
#   ESA_ACCESS_KEY_ID       RAM user with AliyunESAFullAccess
#   ESA_ACCESS_KEY_SECRET
# Repository variables:
#   PUBLIC_ICP              ICP licence number shown on the cn site
#   ESA_PROJECT             ESA Pages project name

name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      skip_cn_media_check:
        description: Deploy the cn site even if OSS is missing media (for first-time setup)
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  global:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Check every post image is in R2
        run: npm run media:check
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx wrangler pages deploy dist --project-name novashang-site --branch master
          --commit-hash "$GITHUB_SHA" --commit-message "$(git log -1 --format=%s)"

  cn:
    # skipped until the Aliyun side is configured
    if: ${{ vars.ESA_PROJECT != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Check every post image is in OSS
        if: ${{ !inputs.skip_cn_media_check }}
        run: npm run media:check:cn
      - name: Build (cn)
        env:
          PUBLIC_ICP: ${{ vars.PUBLIC_ICP }}
        run: npm run build:cn
      - name: Deploy to ESA Pages
        env:
          ESA_ACCESS_KEY_ID: ${{ secrets.ESA_ACCESS_KEY_ID }}
          ESA_ACCESS_KEY_SECRET: ${{ secrets.ESA_ACCESS_KEY_SECRET }}
        # esa-cli reads ESA_ACCESS_KEY_ID / ESA_ACCESS_KEY_SECRET from the environment
        run: >
          npx --yes esa-cli@1.0.13 deploy --skip-update-check
          --name "${{ vars.ESA_PROJECT }}" --assets ./dist-cn
          --environment production --no-preview
          --description "$GITHUB_SHA" 
