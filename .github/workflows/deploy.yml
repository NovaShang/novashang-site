# One push to master publishes both sites from the same commit:
#   global  novashang.com  ->  Cloudflare Pages (project nova-site)
#   cn      gaoshang.me    ->  Aliyun ESA Pages (no sign-in, ICP in the footer)
# Post media: global reads it from R2, cn from OSS; CI copies new files R2 -> OSS.
#
# Repository secrets:
#   CLOUDFLARE_API_TOKEN    token with "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID
#   ESA_ACCESS_KEY_ID       RAM user with AliyunESAFullAccess
#   ESA_ACCESS_KEY_SECRET
#   OSS_ACCESS_KEY_ID       RAM user with write access to the media bucket
#   OSS_ACCESS_KEY_SECRET
# Repository variables:
#   OSS_BUCKET, OSS_REGION  e.g. gaoshang-static, oss-cn-hangzhou
#   PUBLIC_ICP              ICP licence number shown on the cn site
#   ESA_PROJECT             ESA Pages project name

name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  global:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx wrangler pages deploy dist --project-name nova-site --branch main
          --commit-hash "$GITHUB_SHA" --commit-message "$(git log -1 --format=%s)"

  cn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Copy new post media from R2 to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_REGION: ${{ vars.OSS_REGION }}
        run: npm run media:sync-oss
      - name: Build (cn)
        env:
          PUBLIC_ICP: ${{ vars.PUBLIC_ICP }}
        run: npm run build:cn
      - name: Deploy to ESA Pages
        env:
          ESA_ACCESS_KEY_ID: ${{ secrets.ESA_ACCESS_KEY_ID }}
          ESA_ACCESS_KEY_SECRET: ${{ secrets.ESA_ACCESS_KEY_SECRET }}
        # esa-cli reads ESA_ACCESS_KEY_ID / ESA_ACCESS_KEY_SECRET from the environment
        run: >
          npx --yes esa-cli@1.0.13 deploy --skip-update-check
          --name "${{ vars.ESA_PROJECT }}" --assets ./dist-cn
          --environment production --no-preview
          --description "$GITHUB_SHA" 
